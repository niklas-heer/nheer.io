name: Check site

on:
  pull_request:
  push:
    branches: [main]
  # Publishing tolerates new low and moderate advisories, so this daily strict
  # run is what reports them (a failed scheduled run emails the owner).
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # The checks never use the Vercel CLI, and mise 2026.11 refuses to
          # install it: Vercel stopped publishing npm provenance for the CLI
          # and every @vercel/* dependency (trustPolicy=no-downgrade).
          install_args: node bun
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build:check
      - run: npm test

  # Merges Dependabot's patch and minor updates, and any update that fixes a
  # security advisory, once the whole check above has passed. Major updates
  # that are not security fixes stay open for review.
  dependabot-merge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.ghsa-id != ''
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
