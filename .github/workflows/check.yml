name: Check site

on:
  pull_request:
  push:
    branches: [main]
  # Publishing tolerates new low and moderate advisories, so this daily strict
  # run is what reports them (a failed scheduled run emails the owner).
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # The checks never use the Vercel CLI, and mise 2026.11 refuses to
          # install it: Vercel stopped publishing npm provenance for the CLI
          # and every @vercel/* dependency (trustPolicy=no-downgrade).
          install_args: node bun
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build:check
      - run: npm test
